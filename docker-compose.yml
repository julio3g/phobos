version: '3.7'

services:
  pg-phobos:
    image: bitnami/postgresql:latest
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USERNAME=docker
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DATABASE=phobos
    volumes:
      - phobos_pg_data:/bitnami/postgresql

volumes:
  phobos_pg_data:
